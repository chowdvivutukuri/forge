name: Build Forge

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iPhone + Watch app (unsigned)
        run: |
          set +e
          xcodebuild \
            -project Forge.xcodeproj \
            -scheme Forge \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1
          code=$?
          grep -E "error:|BUILD" build.log | tail -40
          exit $code

      - name: Check the Watch app is embedded
        run: |
          APP=build/Build/Products/Release-iphoneos/Forge.app
          ls -la "$APP/Watch" || (echo "::error::Watch app was not embedded" && exit 1)

      - name: Add entitlements (ad-hoc signature, Sideloadly re-signs it)
        run: |
          APP=build/Build/Products/Release-iphoneos/Forge.app
          codesign -f -s - --entitlements Support/Watch.entitlements "$APP/Watch/ForgeWatch.app"
          for ext in "$APP"/PlugIns/*.appex; do [ -e "$ext" ] && codesign -f -s - "$ext"; done
          codesign -f -s - --entitlements Support/iOS.entitlements "$APP"
          codesign -d --entitlements - "$APP" || true

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Forge.app Payload/
          ls Payload/Forge.app/PlugIns || (echo "::error::Live Activity extension was not embedded" && exit 1)
          zip -qry Forge.ipa Payload
          # Same app without the lock-screen Live Activity extension, in case Sideloadly can't sign the extra extension.
          rm -rf Payload/Forge.app/PlugIns
          codesign -f -s - --entitlements Support/iOS.entitlements Payload/Forge.app
          zip -qry Forge-without-LiveActivity.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Forge-ipa
          path: |
            Forge.ipa
            Forge-without-LiveActivity.ipa
          retention-days: 30

      - name: Publish to Releases (easy download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" Forge.ipa Forge-without-LiveActivity.ipa \
            --title "Forge build ${{ github.run_number }}" \
            --notes "Download Forge.ipa below and install it with Sideloadly (see README). If Sideloadly can't sign it (App ID limit), use Forge-without-LiveActivity.ipa." \
            --latest

      - name: Report compile errors
        if: failure()
        run: |
          msg=$(grep -E "(error|fatal error):" build.log | sed 's#.*/forge/##' | sort -u | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Compile errors::${msg:-no error lines found}"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
