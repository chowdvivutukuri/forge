# Xcode project definition. The cloud build turns this into Forge.xcodeproj with XcodeGen.
# To change the app's ID, edit FORGE_BUNDLE_PREFIX below (it must be unique to you).
name: Forge
options:
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

settings:
  base:
    FORGE_BUNDLE_PREFIX: com.forgefit.p4cr9ii
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  Forge:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Shared
    info:
      path: Support/iOS-Info.plist
      properties:
        CFBundleDisplayName: Forge
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        LSApplicationQueriesSchemes: [spotify]
        NSHealthShareUsageDescription: "Forge reads workouts, heart rate and body weight to estimate calories and show your training."
        NSHealthUpdateUsageDescription: "Forge saves your strength workouts to Apple Health."
    entitlements:
      path: Support/iOS.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(FORGE_BUNDLE_PREFIX).forge"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - target: ForgeWatch
        embed: true
        copy:
          destination: productsDirectory
          subpath: "$(CONTENTS_FOLDER_PATH)/Watch"
    scheme: {}

  ForgeWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
      - path: Shared
    info:
      path: Support/Watch-Info.plist
      properties:
        CFBundleDisplayName: Forge
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: "$(FORGE_BUNDLE_PREFIX).forge"
        WKRunsIndependentlyOfCompanionApp: false
        WKBackgroundModes: [workout-processing]
        NSHealthShareUsageDescription: "Forge reads heart rate and calories during your workout."
        NSHealthUpdateUsageDescription: "Forge saves your strength workouts to Apple Health."
    entitlements:
      path: Support/Watch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(FORGE_BUNDLE_PREFIX).forge.watchkitapp"
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
