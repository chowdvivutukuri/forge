<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>3D Form Guide</title>
<style>
/* Layout: a coaching board. Big 3D stage on the left, a live joint-angle readout on the right; stacks on phones. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#18212b; --muted:#5b6877; --line:#d5dbe2;
  --body:#2b3a4a; --body-far:#9aa6b3; --joint:#ffffff;
  --accent:#0e7c86; --arc:#e0782b; --good:#1f8a4c; --good-bg:#e3f4ea; --ghost:#0e7c86; --primary:#d33a4e; --secondary:#7c4dea; --figure:#b4bbc4; --wear:#3b4350;
  --font-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --font-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10161d; --surface:#18212b; --ink:#e8edf2; --muted:#93a1b0; --line:#2a3644;
  --body:#c9d3dd; --body-far:#4b5a6a; --joint:#10161d;
  --accent:#3cc3cd; --arc:#f29a52; --good:#4fd18a; --good-bg:#173527; --ghost:#3cc3cd; --primary:#ff6b7d; --secondary:#b39bff; --figure:#aab2bc; --wear:#4a5462; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#10161d; --surface:#18212b; --ink:#e8edf2; --muted:#93a1b0; --line:#2a3644;
  --body:#c9d3dd; --body-far:#4b5a6a; --joint:#10161d;
  --accent:#3cc3cd; --arc:#f29a52; --good:#4fd18a; --good-bg:#173527; --ghost:#3cc3cd; --primary:#ff6b7d; --secondary:#b39bff; --figure:#aab2bc; --wear:#4a5462; color-scheme:dark }
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:20px 32px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
h1{font-family:var(--font-display);font-weight:700;font-size:2rem;line-height:1;margin:0;letter-spacing:.01em;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;max-width:60ch}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{font:600 .95rem var(--font-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 14px;border-radius:999px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:780px){.grid{grid-template-columns:1fr}}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}
canvas{display:block;width:100%;aspect-ratio:1/1;max-height:72vh;max-width:100%}
.controls{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.controls button{font:600 .9rem var(--font-body);background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:7px 14px;cursor:pointer;min-width:74px}
.controls input[type=range]{flex:1;min-width:140px;accent-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.controls .seg button{background:var(--surface);color:var(--ink);border-radius:0;min-width:0;padding:7px 12px}
.controls .seg button[aria-pressed="true"]{background:var(--accent);color:var(--bg)}
.controls label{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:.9rem;cursor:pointer}
.phase{font:500 .8rem var(--font-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;min-width:9ch}
.panel{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.eyebrow{font:600 .75rem var(--font-body);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 8px}
.rom{font-family:var(--font-display);font-size:1.6rem;font-weight:600;line-height:1.1;margin:0}
.rom b{color:var(--arc);font-variant-numeric:tabular-nums}
.romnote{color:var(--muted);margin:6px 0 0;font-size:.92rem}
.joints{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.joint{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:baseline}
.joint .name{font-weight:600}
.joint .val{font:700 1.35rem var(--font-mono);font-variant-numeric:tabular-nums;color:var(--arc);text-align:right}
.joint .tgt{color:var(--muted);font-size:.88rem;grid-column:1}
.chip{grid-column:2;justify-self:end;font:600 .72rem var(--font-body);text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.chip.on{background:var(--good-bg);color:var(--good);border-color:transparent}
.bar{grid-column:1/-1;position:relative;height:8px;border-radius:4px;background:var(--line);margin-top:4px}
.bar .zone{position:absolute;top:0;bottom:0;background:var(--good);opacity:.35;border-radius:4px}
.bar .tick{position:absolute;top:-3px;width:3px;height:14px;background:var(--arc);border-radius:2px;transform:translateX(-50%)}
.scale{grid-column:1/-1;display:flex;justify-content:space-between;font:500 .7rem var(--font-mono);color:var(--muted)}
ul.cues{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px}
.muscles{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.muscles li{display:grid;grid-template-columns:14px 1fr;gap:2px 10px;align-items:baseline}
.sw{width:14px;height:14px;border-radius:50%;align-self:center}
.sw.p{background:var(--primary)} .sw.s{background:var(--secondary)}
.muscles .role{font:600 .72rem var(--font-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.muscles .what{grid-column:2;font-weight:600}
.muscles .why{grid-column:2;color:var(--muted);font-size:.88rem}
.foot{color:var(--muted);font-size:.85rem;max-width:75ch}
.view{position:relative;touch-action:none;cursor:grab}
.view:active{cursor:grabbing}
#gl{display:block;width:100%;aspect-ratio:1/1;max-height:72vh;max-width:100%}
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-50%);font:700 .85rem var(--font-mono);padding:2px 8px;border-radius:999px;color:var(--surface);pointer-events:none;white-space:nowrap}
.hint{position:absolute;right:10px;top:10px;font:500 .72rem var(--font-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;pointer-events:none}
.controls .row{display:flex;gap:10px;flex-wrap:wrap;width:100%;align-items:center}
.nogl{padding:24px;color:var(--muted)}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font:500 .9rem var(--font-body);pointer-events:none}
[hidden]{display:none!important}
header,.foot{display:none}
body{padding-block:8px 24px}
</style>

<div class="wrap">
  <div class="grid">
    <div class="stage">
      <div class="view" id="view">
        <canvas id="gl" aria-label="3D form animation"></canvas>
        <span class="hint">Drag to rotate</span>
        <span class="loading" id="loading">Loading body model…</span>
        <span class="lbl" id="lbl0"></span><span class="lbl" id="lbl1"></span>
      </div>
      <div class="controls">
        <div class="row">
          <button id="play" type="button">Pause</button>
          <span class="phase" id="phase">Start</span>
          <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Scrub through the rep">
        </div>
        <div class="row">
          <span class="seg" role="group" aria-label="Camera view">
            <button type="button" data-view="side" aria-pressed="true">Side</button><button type="button" data-view="front" aria-pressed="false">Front</button><button type="button" data-view="back" aria-pressed="false">Back</button><button type="button" data-view="spin" aria-pressed="false">360°</button>
          </span>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="card" id="musclesCard"><p class="eyebrow">Target muscles</p><ul class="muscles" id="muscles"></ul></div>
      <div class="card" id="romCard"><p class="eyebrow">Range of motion</p><p class="rom" id="rom"></p><p class="romnote" id="romnote"></p></div>
      <div class="card" id="jointsCard"><p class="eyebrow">Joint angles, live</p><ul class="joints" id="joints"></ul></div>
      <div class="card" id="equipCard"><p class="eyebrow">Equipment</p><p style="margin:0" id="equip"></p></div>
      <div class="card" id="cuesCard"><p class="eyebrow">Cues</p><ul class="cues" id="cues"></ul></div>
    </div>
  </div>
</div>

<script src="forge-body.js"></script>
<script src="three.min.js"></script>
<script src="GLTFLoader.js"></script>
<script>
(()=>{
const D=window.FORGE_FORM||{};
const view=document.getElementById('view'),cv=document.getElementById('gl'),loadingEl=document.getElementById('loading');
if(!window.THREE||!THREE.GLTFLoader){loadingEl.textContent='The 3D viewer could not load. Reload the page to try again.';return;}
if(!D.pattern){loadingEl.textContent='No 3D guide for this exercise yet.';return;}
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const rad=d=>d*Math.PI/180,deg=r=>r*180/Math.PI,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};

// the grip is posed once with the arms hanging, the way the curl page does it, then baked into the hands
function pose(p){const ua=180-10*p,E=165-120*p;return{p,ua,E,fa:ua+180+E};}
const dirW=(a,lat=0)=>new THREE.Vector3(lat,Math.cos(rad(a)),Math.sin(rad(a))).normalize(); // model faces +z
// ---------- scene ----------
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(26,1,.05,30);
scene.add(new THREE.HemisphereLight(0xffffff,0x6b7480,.42));
const key=new THREE.DirectionalLight(0xffffff,1.05);key.position.set(-2,3.2,2.4);key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.bias=-.0002;key.shadow.normalBias=.02;key.shadow.radius=5;
Object.assign(key.shadow.camera,{left:-.7,right:.7,top:1.9,bottom:-.1,near:.5,far:8});scene.add(key);
const rim=new THREE.DirectionalLight(0xdfe8ff,.55);rim.position.set(2,2.2,-2.5);scene.add(rim);
const floorM=new THREE.ShadowMaterial({opacity:.18});const floor=new THREE.Mesh(new THREE.CircleGeometry(1.2,64),floorM);floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const ring=new THREE.Mesh(new THREE.RingGeometry(.78,.8,96),new THREE.MeshBasicMaterial({transparent:true,opacity:.5}));ring.rotation.x=-Math.PI/2;ring.position.y=.001;scene.add(ring);

const skinM=new THREE.MeshStandardMaterial({color:0xffffff,vertexColors:true,roughness:.58,metalness:0});
const greyM=new THREE.MeshStandardMaterial({roughness:.5});
const iron=new THREE.MeshStandardMaterial({color:0x2b2e33,roughness:.42,metalness:.55}),chrome=new THREE.MeshStandardMaterial({color:0xc4c9cf,roughness:.22,metalness:.9});


// ---------- body ----------
let body=null,B={},rest=new Map(),meshes=[],BODY='male',paint=null;
const SHAPE={
  male:{gender_male:1,muscle_max:.55,corr_gender_male__muscle_max:.55,proportions_ideal:.6,weight_min:.15,corr_gender_male__weight_min:.15,corr_weight_min__muscle_max:.08}};
// The model's body sliders are stored as compressed morph targets. Bake the chosen mix into the
// mesh on the CPU once per body type instead of leaving 92 live morphs on the GPU.
// Read the body-slider targets straight from the file (they are compressed, partly sparse).
const CT={5120:[1,'getInt8',127],5121:[1,'getUint8',255],5122:[2,'getInt16',32767],5123:[2,'getUint16',65535],5125:[4,'getUint32',1],5126:[4,'getFloat32',1]};
function glbTargets(ab){
  const dv=new DataView(ab),jl=dv.getUint32(12,true),J=JSON.parse(new TextDecoder().decode(new Uint8Array(ab,20,jl))),bin=20+jl+8;
  const view=i=>{const v=J.bufferViews[i];return{off:bin+(v.byteOffset||0),stride:v.byteStride||0};};
  function read(ai){const a=J.accessors[ai],[sz,get,dn]=CT[a.componentType],div=a.normalized?dn:1,out=new Float32Array(a.count*3);
    if(a.bufferView!==undefined){const v=view(a.bufferView),st=v.stride||sz*3,o=v.off+(a.byteOffset||0);
      for(let i=0;i<a.count;i++)for(let c=0;c<3;c++)out[i*3+c]=Math.max(-1e9,dv[get](o+i*st+c*sz,true)/div);}
    if(a.sparse){const sp=a.sparse,[isz,iget]=CT[sp.indices.componentType],iv=view(sp.indices.bufferView),io=iv.off+(sp.indices.byteOffset||0),vv=view(sp.values.bufferView),vo=vv.off+(sp.values.byteOffset||0);
      for(let n=0;n<sp.count;n++){const idx=dv[iget](io+n*isz,true);for(let c=0;c<3;c++)out[idx*3+c]=dv[get](vo+(n*3+c)*sz,true)/div;}}
    return out;}
  const want=new Set(Object.values(SHAPE).flatMap(o=>Object.keys(o))),res={};
  J.meshes.forEach((m,mi)=>{const names=(m.extras&&m.extras.targetNames)||[];
    m.primitives.forEach((p,pi)=>{const t={};(p.targets||[]).forEach((tg,ti)=>{if(!want.has(names[ti]))return;t[names[ti]]={pos:read(tg.POSITION),nor:tg.NORMAL!==undefined?read(tg.NORMAL):null};});res[mi+':'+pi]=t;});});
  return res;}
let TARGETS={};
function prepMorphs(m,assoc){const g=m.geometry;const key=assoc?assoc.meshes+':'+assoc.primitives:null;
  const flat=a=>{const o=new Float32Array(a.count*3);for(let i=0;i<a.count;i++){o[i*3]=a.getX(i);o[i*3+1]=a.getY(i);o[i*3+2]=a.getZ(i);}return o;};
  g.setAttribute('position',new THREE.BufferAttribute(flat(g.attributes.position),3));
  if(g.attributes.normal)g.setAttribute('normal',new THREE.BufferAttribute(flat(g.attributes.normal),3));
  g.morphAttributes={};m.morphTargetInfluences=undefined;m.morphTargetDictionary=undefined;
  if(key&&TARGETS[key])m.userData.morph={t:TARGETS[key],pos:g.attributes.position.array.slice(),nor:g.attributes.normal?g.attributes.normal.array.slice():null};}
// ---------- modesty: smooth the groin and nipples flat, and dress the body in athletic wear ----------
let MOD=null;
function prepModesty(mesh){
  const g=mesh.geometry,pos=g.attributes.position.array,n=pos.length/3,idx=g.index.array,bones=mesh.skeleton.bones;
  const bp=name=>{const i=bones.findIndex(b=>b.name===name);return new THREE.Vector3().setFromMatrixPosition(mesh.skeleton.boneInverses[i].clone().invert());};
  // weld split vertices (UV seams) so smoothing and normals stay seamless
  const key=new Map(),grp=new Int32Array(n);let G=0;
  for(let i=0;i<n;i++){const k=Math.round(pos[i*3]*1e4)+','+Math.round(pos[i*3+1]*1e4)+','+Math.round(pos[i*3+2]*1e4);let gi=key.get(k);if(gi===undefined){gi=G++;key.set(k,gi);}grp[i]=gi;}
  const nb=Array.from({length:G},()=>new Set());
  for(let t=0;t<idx.length;t+=3){const a=grp[idx[t]],b=grp[idx[t+1]],c=grp[idx[t+2]];nb[a].add(b);nb[a].add(c);nb[b].add(a);nb[b].add(c);nb[c].add(a);nb[c].add(b);}
  const hipL=bp('thigh_l'),hipR=bp('thigh_r'),hip=hipL.clone().add(hipR).multiplyScalar(.5),knee=bp('calf_l'),sh=bp('upperarm_l'),neck=bp('neck_01');
  // weights per vertex for clothing (exclude arms and hands)
  const ji=g.attributes.skinIndex,jw=g.attributes.skinWeight,GET=[ji.getX,ji.getY,ji.getZ,ji.getW];
  const armIdx=new Set(bones.map((b,i)=>/upperarm|lowerarm|hand|index|middle|ring|pinky|thumb/.test(b.name)?i:-1).filter(i=>i>=0));
  let wMax=0;for(let k=0;k<200;k++)wMax=Math.max(wMax,jw.getX(k));const wS=wMax>1.5?1/255:1;
  const groin=new Float32Array(G),chest=new Float32Array(G),wear=new Uint8Array(n),wearAmt=new Float32Array(n);
  const gp=new Float32Array(G*3);for(let i=0;i<n;i++){gp.set([pos[i*3],pos[i*3+1],pos[i*3+2]],grp[i]*3);}
  const sm=(a,b,x)=>smooth(a,b,x);
  for(let q=0;q<G;q++){const x=gp[q*3],y=gp[q*3+1],z=gp[q*3+2];
    groin[q]=(1-sm(.07,.11,Math.abs(x)))*sm(hip.y-.2,hip.y-.13,y)*(1-sm(hip.y-.02,hip.y+.04,y))*sm(hip.z-.03,hip.z+.01,z);
    const cy=sh.y-.15;chest[q]=sm(.04,.07,Math.abs(x))*(1-sm(.13,.16,Math.abs(x)))*(1-sm(.035,.06,Math.abs(y-cy)))*sm(sh.z-.0,sh.z+.05,z);}
  for(let i=0;i<n;i++){let arm=0;for(let c=0;c<4;c++){if(armIdx.has(GET[c].call(ji,i)))arm+=GET[c].call(jw,i)*wS;}if(arm>.25)continue;
    const y=pos[i*3+1];
    const band=(lo,hi)=>smooth(lo-.012,lo+.012,y)*(1-smooth(hi-.012,hi+.012,y)),fade=1-Math.min(1,arm*4);
    const sAmt=band(hip.y-.22,hip.y+.09)*fade,tAmt=band(sh.y-.26,sh.y-.035)*(1-smooth(.14,.17,Math.abs(pos[i*3])))*fade;
    if(sAmt>=tAmt&&sAmt>0){wear[i]=1;wearAmt[i]=sAmt;}else if(tAmt>0){wear[i]=2;wearAmt[i]=tAmt;}   // shorts / top (female only)
  }
  MOD={grp,G,nb,groin,chest,wear,wearAmt,idx};}
function modesty(mesh){if(!MOD)return;const g=mesh.geometry,P=g.attributes.position.array,N=g.attributes.normal.array,{grp,G,nb,groin,chest,idx}=MOD,n=P.length/3;
  const gp=new Float32Array(G*3);for(let i=0;i<n;i++){const q=grp[i];gp[q*3]=P[i*3];gp[q*3+1]=P[i*3+1];gp[q*3+2]=P[i*3+2];}
  const w=new Float32Array(G);for(let q=0;q<G;q++)w[q]=Math.max(groin[q],chest[q]*(BODY==='male'?1:.9));
  const tmp=new Float32Array(G*3);
  for(let it=0;it<45;it++){for(let q=0;q<G;q++){if(!w[q]){continue;}let sx=0,sy=0,sz=0,c=0;for(const o of nb[q]){sx+=gp[o*3];sy+=gp[o*3+1];sz+=gp[o*3+2];c++;}
      const k=.6*w[q]*(chest[q]>groin[q]&&it>14?0:1);tmp[q*3]=gp[q*3]+(sx/c-gp[q*3])*k;tmp[q*3+1]=gp[q*3+1]+(sy/c-gp[q*3+1])*k;tmp[q*3+2]=gp[q*3+2]+(sz/c-gp[q*3+2])*k;}
    for(let q=0;q<G;q++)if(w[q]){gp[q*3]=tmp[q*3];gp[q*3+1]=tmp[q*3+1];gp[q*3+2]=tmp[q*3+2];}}
  for(let i=0;i<n;i++){const q=grp[i];P[i*3]=gp[q*3];P[i*3+1]=gp[q*3+1];P[i*3+2]=gp[q*3+2];}
  // welded normals so seams don't show
  const gn=new Float32Array(G*3),a=new THREE.Vector3(),b=new THREE.Vector3(),c=new THREE.Vector3(),fn=new THREE.Vector3();
  for(let t=0;t<idx.length;t+=3){const i0=idx[t],i1=idx[t+1],i2=idx[t+2];a.fromArray(P,i0*3);b.fromArray(P,i1*3);c.fromArray(P,i2*3);
    fn.subVectors(c,b).cross(a.sub(b));for(const q of[grp[i0],grp[i1],grp[i2]]){gn[q*3]+=fn.x;gn[q*3+1]+=fn.y;gn[q*3+2]+=fn.z;}}
  for(let i=0;i<n;i++){const q=grp[i],l=Math.hypot(gn[q*3],gn[q*3+1],gn[q*3+2])||1;N[i*3]=gn[q*3]/l;N[i*3+1]=gn[q*3+1]/l;N[i*3+2]=gn[q*3+2]/l;}
  g.attributes.position.needsUpdate=true;g.attributes.normal.needsUpdate=true;}
function applyShape(){for(const m of meshes){const d=m.userData.morph;if(!d)continue;const g=m.geometry,P=g.attributes.position.array,N=g.attributes.normal&&g.attributes.normal.array;
  P.set(d.pos);if(N&&d.nor)N.set(d.nor);
  for(const[k,w]of Object.entries(SHAPE[BODY])){const t=d.t[k];if(!t||!w)continue;
    for(let n=0;n<P.length;n++)P[n]+=t.pos[n]*w;
    if(N&&t.nor)for(let n=0;n<N.length;n++)N[n]+=t.nor[n]*w;}
  if(N)for(let n=0;n<N.length;n+=3){const l=Math.hypot(N[n],N[n+1],N[n+2])||1;N[n]/=l;N[n+1]/=l;N[n+2]/=l;}
  g.attributes.position.needsUpdate=true;if(N)g.attributes.normal.needsUpdate=true;g.computeBoundingSphere();}
  if(paint){refitBones(paint.mesh);if(GRIP)bakeGrip(paint.mesh);modesty(paint.mesh);}lastP=-1;}
// The body-shape morphs move the skin but not the skeleton, so the joints drift away from the creases (by ~5 cm at the hands).

  aim(B.spine_02,B.neck_01,ms.clone().sub(mh).normalize());
  aim(B.neck_01,B.head,FV(F,J.head).sub(FV(F,J.neck)).normalize());
  J.leg.forEach((L,i)=>{const s=SIDES[i],h=FV(F,L[0]),k=FV(F,L[1]),a=FV(F,L[2]),t=FV(F,L[3]);
    aim(B['thigh_'+s],B['calf_'+s],k.clone().sub(h).normalize());
    aim(B['calf_'+s],B['foot_'+s],a.clone().sub(k).normalize());
    aim(B['foot_'+s],B['ball_'+s],t.clone().sub(a).normalize());});
  J.arm.forEach((A,i)=>{const s=SIDES[i],sx=s==='l'?1:-1,sh=FV(F,A[0]),el=FV(F,A[1]),wr=FV(F,A[2]);
    const U=B['upperarm_'+s],L=B['lowerarm_'+s],H=B['hand_'+s];
    aim(U,L,el.clone().sub(sh).normalize());
    const f=wr.clone().sub(el).normalize();aim(L,H,f);aim(H,B['middle_01_'+s],f);
    if(!GRIP&&wr.y<.14){
      // hand on the floor: lay it flat, fingers pointing the way the body faces, palm down
      const hd=ms.clone().sub(mh);hd.y=0;if(hd.lengthSq()<1e-4)hd.set(0,0,1);hd.normalize();aim(H,B['middle_01_'+s],hd);
      const acr=P(B['pinky_01_'+s]).sub(P(B['index_01_'+s]));acr.addScaledVector(hd,-acr.dot(hd)).normalize();
      const out=lat.clone().multiplyScalar(sx);out.addScaledVector(hd,-out.dot(hd));out.y=Math.max(0,out.y);
      if(out.lengthSq()>1e-4){out.normalize();twist(H,hd,Math.atan2(hd.dot(new THREE.Vector3().crossVectors(acr,out)),acr.dot(out)));}}
    if(GRIPC[s]&&(BAR_GRIP||EXI.some(m=>m.t==='barbell'))){
      // turn the hand about the forearm so the grip lines up with the bar across the body
      const cur=new THREE.Vector3(1,0,0).applyQuaternion(H.getWorldQuaternion(new THREE.Quaternion()).multiply(GRIPC[s].q));
      const tgt=lat.clone();tgt.addScaledVector(f,-tgt.dot(f));cur.addScaledVector(f,-cur.dot(f));
      if(tgt.lengthSq()>1e-4&&cur.lengthSq()>1e-4){tgt.normalize();cur.normalize();if(cur.dot(tgt)<0)tgt.negate();
        const a=Math.atan2(f.dot(new THREE.Vector3().crossVectors(cur,tgt)),cur.dot(tgt));twist(L,f,a*.3);twist(H,f,a*.7);}}});
  // put the hips where the figure's are (the floor is y = 0)
  body.updateMatrixWorld(true);const cur=P(B.thigh_l).add(P(B.thigh_r)).multiplyScalar(.5);body.position.add(mh.sub(cur));body.updateMatrixWorld(true);
  placeGear(F);}

// ---------- equipment and props ----------
const gear=new THREE.Group();scene.add(gear);
const propM=new THREE.MeshStandardMaterial({color:0x8d949c,roughness:.6}),padM=new THREE.MeshStandardMaterial({color:0x3b4350,roughness:.7});
const mk=(geo,mat)=>{const m=new THREE.Mesh(geo,mat);m.castShadow=true;return m;};
function dumbbell(){const g=new THREE.Group(),h=mk(new THREE.CylinderGeometry(.016,.016,.15,20),chrome);h.rotation.z=Math.PI/2;g.add(h);
  for(const e of[-1,1]){const hx=mk(new THREE.CylinderGeometry(.062,.062,.065,6),iron);hx.rotation.z=Math.PI/2;hx.position.x=e*.105;g.add(hx);}return g;}
function barbell(){const g=new THREE.Group(),bar=mk(new THREE.CylinderGeometry(.014,.014,2.0,16),chrome);bar.rotation.z=Math.PI/2;g.add(bar);
  for(const e of[-1,1]){const pl=mk(new THREE.CylinderGeometry(.225,.225,.05,40),iron);pl.rotation.z=Math.PI/2;pl.position.x=e*.72;g.add(pl);
    const c=mk(new THREE.CylinderGeometry(.03,.03,.06,16),chrome);c.rotation.z=Math.PI/2;c.position.x=e*.78;g.add(c);}return g;}
function kettlebell(){const g=new THREE.Group(),b=mk(new THREE.SphereGeometry(.085,24,18),iron);b.position.y=-.13;g.add(b);
  const h=mk(new THREE.TorusGeometry(.05,.011,10,24,Math.PI),iron);h.position.y=-.06;g.add(h);return g;}
const wheel=()=>{const g=new THREE.Group(),w=mk(new THREE.CylinderGeometry(.09,.09,.06,32),iron);w.rotation.z=Math.PI/2;g.add(w);
  const a=mk(new THREE.CylinderGeometry(.014,.014,.36,12),chrome);a.rotation.z=Math.PI/2;g.add(a);return g;};
const G={};for(const im of EXI){
  if(im.t==='dumbbell'){G.dl=dumbbell();G.dr=dumbbell();if(im.hands==='near')G.dl.visible=false;gear.add(G.dl,G.dr);}
  else if(im.t==='barbell'){G.bb=barbell();gear.add(G.bb);}
  else if(im.t==='kettlebell'){G.kb=kettlebell();gear.add(G.kb);}
  else if(im.t==='wheel'){G.wh=wheel();gear.add(G.wh);}
  else if(im.t==='sled'){G.sl=mk(new THREE.BoxGeometry(.6,.5,.04),padM);gear.add(G.sl);}}
const lineM=new THREE.LineBasicMaterial({color:0x7d858f}),bandM=new THREE.LineDashedMaterial({color:0xe0782b,dashSize:.04,gapSize:.03});
const cords=EXI.filter(i=>i.t==='cable'||i.t==='band').map(im=>{const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3()]),im.t==='band'?bandM:lineM);gear.add(l);return{im,l};});
function grip(s){const H=B['hand_'+s];if(GRIPC[s])return{p:H.localToWorld(GRIPC[s].p.clone()),q:H.getWorldQuaternion(new THREE.Quaternion()).multiply(GRIPC[s].q)};
  return{p:P(H).lerp(P(B['middle_01_'+s]),.9),q:H.getWorldQuaternion(new THREE.Quaternion())};}
function placeGear(F){
  if(G.dl){const a=grip('l'),b=grip('r');G.dl.position.copy(a.p);G.dl.quaternion.copy(a.q);G.dr.position.copy(b.p);G.dr.quaternion.copy(b.q);}
  if(G.bb){const a=grip('l').p,b=grip('r').p,c=a.clone().add(b).multiplyScalar(.5);G.bb.position.copy(c);G.bb.quaternion.setFromUnitVectors(new THREE.Vector3(1,0,0),a.sub(b).normalize());}
  if(G.kb){const a=grip('l').p,b=grip('r').p,near=EXI.find(i=>i.t==='kettlebell').hands==='near';G.kb.position.copy(near?b:a.add(b).multiplyScalar(.5));}
  if(G.wh){const a=grip('l').p,b=grip('r').p;G.wh.position.copy(a.clone().add(b).multiplyScalar(.5));G.wh.position.y-=.04;G.wh.quaternion.setFromUnitVectors(new THREE.Vector3(1,0,0),a.sub(b).normalize());}
  if(G.sl){const fl=P(B.foot_l).add(P(B.ball_l)).multiplyScalar(.5),fr=P(B.foot_r).add(P(B.ball_r)).multiplyScalar(.5),c=fl.clone().add(fr).multiplyScalar(.5);
    const n=P(B.foot_l).sub(P(B.calf_l)).add(P(B.foot_r).sub(P(B.calf_r))).normalize();G.sl.position.copy(c.addScaledVector(n,.05));G.sl.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),n);}
  for(const{im,l}of cords){const hs=im.hands==='near'?['r']:im.hands==='both'?['r','l']:['r'];const pts=[];
    for(const s of hs){const h=grip(s).p;let A;
      if(Array.isArray(im.anchor)){const z=im.anchor[2]==null?h.x/K:(s==='l'?1:-1)*im.anchor[2];A=new THREE.Vector3(z*K,(im.anchor[1]-GROUND)*K,(im.anchor[0]-PAT.cx)*K);}
      else if(im.anchor==='hands'){A=grip('l').p;}else{A=P(B['ball_'+s]);}
      pts.push(h,A);}
    l.geometry.dispose();l.geometry=new THREE.BufferGeometry().setFromPoints(pts);if(l.computeLineDistances)l.computeLineDistances();}}
// benches, bars and machines from the pattern, as simple grey shapes
function buildProps(){
for(const pr of[...(PAT.pr||[]),...((D.ex&&D.ex.x)||[])]){
  const pt=a=>new THREE.Vector3((a[2]||0)*K,(a[1]-GROUND)*K,(a[0]-PAT.cx)*K);
  if(pr.k==='box'){const a=pt(pr.p[0]),b=pt(pr.p[1]),s=b.clone().sub(a);const m=mk(new THREE.BoxGeometry(Math.max(.02,Math.abs(s.x)),Math.max(.02,Math.abs(s.y)),Math.max(.02,Math.abs(s.z))),padM);
    m.position.copy(a.add(b).multiplyScalar(.5));m.receiveShadow=true;scene.add(m);}
  else if(pr.k==='seg'||pr.k==='line'){for(let i=0;i<pr.p.length-1;i++){const a=pt(pr.p[i]),b=pt(pr.p[i+1]),len=a.distanceTo(b);if(len<1e-3)continue;
    const m=mk(new THREE.CylinderGeometry(Math.max(.012,(pr.w||1.6)*K*.35),Math.max(.012,(pr.w||1.6)*K*.35),len,12),propM);
    m.position.copy(a.clone().add(b).multiplyScalar(.5));m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),b.sub(a).normalize());scene.add(m);}}
  else if(pr.k==='dot'){const m=mk(new THREE.SphereGeometry(Math.max(.02,(pr.w||1.6)*K),16,12),propM);m.position.copy(pt(pr.p[0]));scene.add(m);}
  else if(pr.k==='poly'&&pr.p.length>=3){const pts=pr.p.map(pt),c=pts.reduce((s,v)=>s.add(v),new THREE.Vector3()).multiplyScalar(1/pts.length);
    const geo=new THREE.BufferGeometry();const arr=[];for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length];arr.push(c.x,c.y,c.z,a.x,a.y,a.z,b.x,b.y,b.z);}
    geo.setAttribute('position',new THREE.Float32BufferAttribute(arr,3));geo.computeVertexNormals();const m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:0x8d949c,side:THREE.DoubleSide,roughness:.6}));scene.add(m);}}}

// ---------- joint angles: the two joints that move most in this exercise ----------
const ang3=(a,b,c)=>{const u=a.clone().sub(b),v=c.clone().sub(b);return deg(u.angleTo(v));};
const JOINTS=[
  {label:'Elbow',f:F=>ang3(FV(F,3),FV(F,4),FV(F,5)),bones:['upperarm_r','lowerarm_r','hand_r']},
  {label:'Shoulder',f:F=>ang3(FV(F,9),FV(F,3),FV(F,4)),bones:['thigh_r','upperarm_r','lowerarm_r']},
  {label:'Hip',f:F=>ang3(FV(F,3),FV(F,9),FV(F,10)),bones:['upperarm_r','thigh_r','calf_r']},
  {label:'Knee',f:F=>ang3(FV(F,9),FV(F,10),FV(F,11)),bones:['thigh_r','calf_r','foot_r']}];
const SAMPLES=PAT.f;
JOINTS.forEach(j=>{const v=SAMPLES.map(F=>j.f(F));j.a=v[0];j.b=v[v.length-1];j.lo=Math.min(...v);j.hi=Math.max(...v);j.range=j.hi-j.lo;});
const ANG=[...JOINTS].sort((a,b)=>b.range-a.range).slice(0,2).filter(j=>j.range>=8);
// arcs drawn in the plane of each joint
const arcs=ANG.map(()=>{const g=new THREE.Group();
  const a=new THREE.Mesh(new THREE.BufferGeometry(),new THREE.MeshBasicMaterial({transparent:true,opacity:.28,depthTest:false,side:THREE.DoubleSide}));
  const c=new THREE.Mesh(new THREE.BufferGeometry(),new THREE.MeshBasicMaterial({depthTest:false,side:THREE.DoubleSide}));a.renderOrder=c.renderOrder=10;g.add(a,c);scene.add(g);return{g,a,c};});
function setArc(arc,Bp,A,C,col,k){
  const u=A.clone().sub(Bp).normalize(),w=new THREE.Vector3().crossVectors(u,C.clone().sub(Bp)).normalize();if(w.lengthSq()<1e-6)return Bp.clone();
  const v=new THREE.Vector3().crossVectors(w,u),th=u.angleTo(C.clone().sub(Bp).normalize());
  arc.a.geometry.dispose();arc.c.geometry.dispose();arc.a.geometry=new THREE.CircleGeometry(.09,32,0,th);arc.c.geometry=new THREE.RingGeometry(.083,.093,32,1,0,th);
  arc.a.material.color.set(col);arc.c.material.color.set(col);arc.g.position.copy(Bp);arc.g.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(u,v,w));
  return Bp.clone().addScaledVector(u,Math.cos(th/2)*k).addScaledVector(v,Math.sin(th/2)*k);}

// ---------- load ----------
// the model ships base64-encoded in forge-body.js next to the page
Promise.resolve(window.FORGE_BODY||'').then(b64=>{if(!b64)throw new Error('missing body');return b64;}).then(b64=>{const bin=atob(b64.trim()),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u.buffer;}).then(ab=>{TARGETS=glbTargets(ab);new THREE.GLTFLoader().parse(ab,'',gltf=>{
  body=gltf.scene;scene.add(body);
  body.traverse(o=>{if(o.isBone){B[o.name]=o;rest.set(o,o.quaternion.clone());}
    if(o.isMesh){meshes.push(o);o.castShadow=true;o.receiveShadow=false;o.frustumCulled=false;prepMorphs(o,gltf.parser.associations.get(o));
      if(/Eyebrows|Eyelashes|Teeth|Tongue/.test(o.name))o.visible=false;
      else if(o.name==='base'||(o.parent&&o.parent.name==='base'&&o.geometry.attributes._ccregion===undefined&&!paint&&o.geometry.attributes.position.count>10000)){o.material=skinM;paint=buildPaint(o);}
      else o.material=greyM;}});
  if(!paint){const m=meshes.find(m=>m.geometry.attributes.position.count>10000);if(m){m.material=skinM;paint=buildPaint(m);}}
  if(paint)prepModesty(paint.mesh);
  applyShape();restBasis();frame0();readColors();loadingEl.hidden=true;window.__ready=true;
},fail);}).catch(fail);
function fail(){loadingEl.textContent='The body model could not load. Reload the page to try again.';}

// ---------- camera ----------
let az=200,el=8,spin=false,drag=null;const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const TARGET=new THREE.Vector3(0,.9,0),VIEWS={side:200,front:-90,back:90};let RADIUS=3.9;
function placeCam(){const a=rad(az),e=rad(el);camera.position.set(Math.cos(e)*Math.cos(a)*RADIUS,TARGET.y+Math.sin(e)*RADIUS,TARGET.z-Math.cos(e)*Math.sin(a)*RADIUS);camera.lookAt(TARGET);}
function setView(v){document.querySelectorAll('[data-view]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.view===v));spin=v==='spin';if(!spin){az=VIEWS[v];el=8;}}
view.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,az,el};view.setPointerCapture(e.pointerId);});
view.addEventListener('pointermove',e=>{if(!drag)return;az=drag.az-(e.clientX-drag.x)*.5;el=clamp(drag.el+(e.clientY-drag.y)*.3,-5,50);
  spin=false;document.querySelectorAll('[data-view]').forEach(x=>x.setAttribute('aria-pressed','false'));});
view.addEventListener('pointerup',()=>drag=null);view.addEventListener('pointercancel',()=>drag=null);
// frame the whole movement: centre on the figure's extent over the rep
function frame0(){buildProps();let lo=new THREE.Vector3(1e9,1e9,1e9),hi=new THREE.Vector3(-1e9,-1e9,-1e9);
  for(const F of PAT.f)for(let i=0;i<F.length/3;i++){const v=FV(F,i);lo.min(v);hi.max(v);}
  TARGET.set(0,(lo.y+hi.y)/2+.02,(lo.z+hi.z)/2);RADIUS=clamp(Math.max(hi.y-lo.y,hi.z-lo.z,1.3)*2.7,3.6,5.6);}
if(PAT.view==='f')setView('front');

// ---------- panel ----------
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ui={play:document.getElementById('play'),scrub:document.getElementById('scrub'),phase:document.getElementById('phase'),lbl:[0,1].map(i=>document.getElementById('lbl'+i))};
document.getElementById('muscles').innerHTML=(D.primary||[]).map(m=>`<li><span class="sw p"></span><span class="role">Primary</span><span class="what">${esc(m)}</span></li>`).join('')
  +(D.secondary||[]).map(m=>`<li><span class="sw s"></span><span class="role">Secondary</span><span class="what">${esc(m)}</span></li>`).join('');
document.getElementById('equip').textContent=D.equipment||'Bodyweight';
document.getElementById('cues').innerHTML=(D.cues||[]).map(c=>`<li>${esc(c)}</li>`).join('');
if(!(D.cues||[]).length)document.getElementById('cuesCard').hidden=true;
if(ANG.length){const a=ANG[0];document.getElementById('rom').innerHTML=`${a.label} ${Math.round(a.a)}° → ${Math.round(a.b)}° · <b>${Math.round(a.range)}°</b> of travel`;
  document.getElementById('romnote').textContent=ANG.length>1?`${ANG[1].label} moves ${Math.round(ANG[1].range)}° too. Angles are the inside angle at each joint; 180° = straight.`:'Angles are the inside angle at the joint; 180° = straight.';
  document.getElementById('joints').innerHTML=ANG.map((a,i)=>{const mn=Math.max(0,Math.floor((a.lo-15)/10)*10),mx=Math.min(180,Math.ceil((a.hi+15)/10)*10),span=mx-mn||1;
    return `<li class="joint"><span class="name">${a.label}</span><span class="val" id="v${i}">–</span>
    <span class="tgt">Range ${Math.round(a.lo)}–${Math.round(a.hi)}° each rep</span><span class="chip" id="c${i}">Moving</span>
    <div class="bar"><div class="zone" style="left:${(a.lo-mn)/span*100}%;width:${(a.hi-a.lo)/span*100}%"></div><div class="tick" id="k${i}" data-mn="${mn}" data-span="${span}"></div></div>
    <div class="scale"><span>${mn}°</span><span>${mx}°</span></div></li>`}).join('');}
else{document.getElementById('romCard').hidden=true;document.getElementById('jointsCard').hidden=true;}

let playing=!reduce,t=reduce?.5:0,last=performance.now(),W=0,H=0,tick=0,col={},lastP=-1;
const T=Math.max(2.8,(PAT.T||2.6)*1.5),LOOP=!!PAT.loop;
function pAt(t){const x=((t%1)+1)%1;if(LOOP)return x;if(x<.1)return 0;if(x<.45)return smooth(0,1,(x-.1)/.35);if(x<.55)return 1;if(x<.9)return 1-smooth(0,1,(x-.55)/.35);return 0;}
function phaseName(t){const x=((t%1)+1)%1;if(LOOP)return 'Moving';return x<.1||x>=.9?'Start':x<.45?'Moving':x<.55?'End':'Returning';}
function readColors(){col={good:css('--good'),arc:css('--arc')};greyM.color.set(css('--figure'));ring.material.color.set(css('--line'));lastP=-1;}
function resize(){const r=cv.getBoundingClientRect();if(r.width===W&&r.height===H)return;W=r.width;H=r.height;renderer.setSize(W,H,false);camera.aspect=W/H;camera.updateProjectionMatrix();}
function frame(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;
  if(playing){t+=dt/T;ui.scrub.value=Math.round((((t%1)+1)%1)*1000);}
  if(spin)az+=dt*30;
  if(tick++%40===0)readColors();
  resize();placeCam();
  const p=pAt(t),F=frameAt(p);
  if(body&&REST0){poseFrame(F);if(Math.abs(p-lastP)>.05){repaint(LOOP?1:p);lastP=p;}
    ANG.forEach((a,i)=>{const v=a.f(F),atEnd=Math.abs(v-a.b)<4&&a.range>8,c=atEnd?col.good:col.arc;
      const [b0,b1,b2]=a.bones.map(n=>P(B[n]));const lp=setArc(arcs[i],b1,b0,b2,c,.17);
      const s=lp.project(camera),el=ui.lbl[i];el.style.left=((s.x+1)/2*W)+'px';el.style.top=((1-s.y)/2*H)+'px';el.style.background=c;el.textContent=`${a.label} ${Math.round(v)}°`;
      document.getElementById('v'+i).textContent=Math.round(v)+'°';const ch=document.getElementById('c'+i);ch.textContent=atEnd?'End range':'Moving';ch.classList.toggle('on',atEnd);
      const k=document.getElementById('k'+i);k.style.left=clamp((v-+k.dataset.mn)/+k.dataset.span*100,0,100)+'%';});}
  ui.phase.textContent=phaseName(t);
  renderer.render(scene,camera);requestAnimationFrame(frame);}

ui.play.addEventListener('click',()=>{playing=!playing;ui.play.textContent=playing?'Pause':'Play';last=performance.now();});
ui.scrub.addEventListener('input',()=>{playing=false;ui.play.textContent='Play';t=ui.scrub.value/1000;});
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
ui.play.textContent=playing?'Pause':'Play';
window.__setT=x=>{playing=false;t=x;};window.__setView=setView;
requestAnimationFrame(frame);
})();
</script>

</html>
