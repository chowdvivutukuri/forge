<title>Forge Form Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: gym-signage header, sticky control rail, dense grid of looping figures; tap one for a large turnable view. */
:root {
  --bg: #f1f2f4;
  --surface: #ffffff;
  --ink: #18191d;
  --muted: #5d6068;
  --line: #d9dbe0;
  --accent: #e2591f;
  --accent-soft: #fbe3d6;
  --steel: #5b5e66;
  --prop: #a9acb4;
  --prop-fill: #dcdee3;
  --cable: #9a9da5;
  --pad: #f0a57f;
  --ground: #c4c7cd;
  --face: #ffffff;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111215; --surface: #1a1b20; --ink: #ecedf0; --muted: #a3a6ae; --line: #2c2e35;
    --accent: #ff7a3d; --accent-soft: #3a2218; --steel: #b4b7bf; --prop: #5d6069; --prop-fill: #2a2c33;
    --cable: #6f727b; --pad: #b8653f; --ground: #3a3c44; --face: #1a1b20; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111215; --surface: #1a1b20; --ink: #ecedf0; --muted: #a3a6ae; --line: #2c2e35;
  --accent: #ff7a3d; --accent-soft: #3a2218; --steel: #b4b7bf; --prop: #5d6069; --prop-fill: #2a2c33;
  --cable: #6f727b; --pad: #b8653f; --ground: #3a3c44; --face: #1a1b20; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 64px; }
header h1 {
  font-family: var(--display); font-weight: 700; font-size: clamp(2.4rem, 7vw, 4.2rem); line-height: .92;
  letter-spacing: .01em; text-transform: uppercase; margin: 0; text-wrap: balance;
}
header h1 span { color: var(--accent); }
header p { color: var(--muted); max-width: 60ch; margin: 12px 0 0; }
.count { font-family: var(--mono); font-size: 12px; color: var(--muted); letter-spacing: .04em; margin-top: 10px; }

.rail {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding-block: 14px; margin-top: 18px;
  border-bottom: 1px solid var(--line);
}
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface); }
.seg button, .chips button {
  font: 600 13px/1 var(--body); color: var(--muted); background: none; border: 0; border-radius: 999px;
  padding: 8px 13px; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 1px solid var(--line); background: var(--surface); }
.chips button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.search { flex: 1 1 180px; min-width: 0; }
.search input {
  width: 100%; font: 15px var(--body); color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px;
}
.label { font: 600 11px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

.group-title {
  font-family: var(--display); font-weight: 600; font-size: 1.6rem; text-transform: uppercase; letter-spacing: .02em;
  margin: 28px 0 10px; display: flex; align-items: baseline; gap: 10px;
}
.group-title small { font: 500 12px var(--mono); color: var(--muted); letter-spacing: 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 8px 11px;
  cursor: pointer; text-align: left; font: inherit; color: inherit; display: flex; flex-direction: column; gap: 6px;
  min-width: 0; transition: border-color .15s;
}
.card:hover { border-color: var(--accent); }
.card canvas { width: 100%; aspect-ratio: 1; max-width: 100%; display: block; }
.card .name { font-weight: 600; font-size: 14px; line-height: 1.25; padding-inline: 4px; }
.card .eq { font: 500 11px var(--mono); color: var(--muted); padding-inline: 4px; }

dialog {
  border: 0; padding: 0; border-radius: 16px; background: var(--surface); color: var(--ink);
  width: min(880px, calc(100vw - 24px)); max-height: calc(100vh - 24px);
}
dialog::backdrop { background: rgb(0 0 0 / .45); }
.detail { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 20px; padding: 20px; }
@media (max-width: 680px) { .detail { grid-template-columns: 1fr; } }
.stage { position: relative; background: var(--bg); border-radius: 12px; touch-action: none; cursor: grab; }
.stage:active { cursor: grabbing; }
.stage canvas { width: 100%; aspect-ratio: 1; display: block; max-width: 100%; }
.angle { position: absolute; left: 12px; bottom: 10px; font: 500 12px var(--mono); color: var(--muted); }
.hint { position: absolute; right: 12px; bottom: 10px; font-size: 12px; color: var(--muted); }
.info h2 { font-family: var(--display); font-size: 2rem; text-transform: uppercase; line-height: 1; margin: 4px 0 6px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 16px; }
.tag { font: 500 12px var(--mono); border: 1px solid var(--line); border-radius: 6px; padding: 3px 7px; color: var(--muted); }
.tag.m { color: var(--accent); border-color: var(--accent); }
ol.cues { margin: 8px 0 0; padding-left: 1.3em; display: grid; gap: 8px; }
ol.cues li::marker { font-family: var(--mono); color: var(--accent); }
.tip { margin-top: 14px; padding: 10px 12px; background: var(--accent-soft); border-radius: 8px; font-size: 14px; }
.close { position: absolute; top: 12px; right: 12px; border: 0; background: var(--bg); color: var(--ink); width: 34px; height: 34px;
  border-radius: 50%; font-size: 18px; cursor: pointer; }
.dhead { position: relative; }
.empty { color: var(--muted); padding: 30px 0; }
</style>

<div class="wrap">
  <header>
    <h1>Forge <span>Form</span> Library</h1>
    <p>Every exercise in the Forge app, animated through a full rep. Switch between side, front and back views, or tap an exercise to turn the figure yourself.</p>
    <div class="count" id="count"></div>
  </header>

  <div class="rail" role="toolbar" aria-label="Filters">
    <div>
      <div class="label">View</div>
      <div class="seg" id="views">
        <button data-yaw="90" aria-pressed="true">Side</button>
        <button data-yaw="0" aria-pressed="false">Front</button>
        <button data-yaw="180" aria-pressed="false">Back</button>
        <button data-yaw="spin" aria-pressed="false">Turn</button>
      </div>
    </div>
    <div>
      <div class="label">Muscle group</div>
      <div class="chips" id="groups"></div>
    </div>
    <div class="search">
      <div class="label"><label for="q">Search</label></div>
      <input id="q" type="search" placeholder="Squat, cable, pec deck&hellip;" autocomplete="off">
    </div>
  </div>

  <main id="list"></main>
</div>

<dialog id="dlg" aria-labelledby="dname">
  <div class="dhead"><button class="close" id="dclose" aria-label="Close">&times;</button></div>
  <div class="detail">
    <div>
      <div class="stage" id="stage"><canvas id="big" width="600" height="600"></canvas>
        <span class="angle" id="angle"></span><span class="hint">Drag to turn</span></div>
      <div class="seg" id="dviews" style="margin-top:12px">
        <button data-yaw="90">Side</button><button data-yaw="0">Front</button>
        <button data-yaw="180">Back</button><button data-yaw="spin">Turn</button>
      </div>
    </div>
    <div class="info">
      <div class="label" id="dgroup"></div>
      <h2 id="dname"></h2>
      <div class="tags" id="dtags"></div>
      <div class="label">Form cues</div>
      <ol class="cues" id="dcues"></ol>
      <div class="tip" id="dtip" hidden></div>
    </div>
  </div>
</dialog>

<script>
const DATA = /*DATA*/null;
const META = /*META*/null;
const NF = DATA.patterns[Object.keys(DATA.patterns)[0]].f.length;
const GROUND = DATA.ground, HEAD_R = DATA.head;
const HEAD = 0, NECK = 1, PELVIS = 2, NOSE = 17;
const ARM = [[3, 4, 5], [6, 7, 8]];
const LEG = [[9, 10, 11, 12], [13, 14, 15, 16]];
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

// ---------- scene builder: same as tools/forms/forms.py and Shared/FormFigure.swift ----------
function project(P, yaw, cx) {
  const s = Math.sin(yaw), c = Math.cos(yaw), dx = P[0] - cx;
  return [dx * s + P[2] * c + 50, P[1], dx * c - P[2] * s];
}
function hull(points) {
  const pts = points.map(p => [Math.round(p[0] * 1000) / 1000, Math.round(p[1] * 1000) / 1000])
    .sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  if (pts.length <= 2) return pts;
  const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lower = [], upper = [];
  for (const p of pts) { while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) lower.pop(); lower.push(p); }
  for (let i = pts.length - 1; i >= 0; i--) { const p = pts[i]; while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) upper.pop(); upper.push(p); }
  return lower.slice(0, -1).concat(upper.slice(0, -1));
}
const add3 = (a, b, k = 1) => [a[0] + b[0] * k, a[1] + b[1] * k, a[2] + b[2] * k];
const mid3 = (...ps) => [0, 1, 2].map(i => ps.reduce((s, p) => s + p[i], 0) / ps.length);
const norm3 = v => { const m = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / m, v[1] / m, v[2] / m]; };

function scene(pat, ex, F, yaw) {
  const cx = pat.cx, s = Math.sin(yaw);
  const pt = i => [F[i * 3], F[i * 3 + 1], F[i * 3 + 2]];
  const pr = P => project(P, yaw, cx);
  const props = [], items = [];
  for (const prim of pat.pr.concat(ex.x || [])) {
    if (prim.k === "seg") {
      const q = prim.p.map(pr);
      props.push({ t: "line", pts: q, w: prim.w, role: "prop", d: q.reduce((a, b) => a + b[2], 0) / q.length });
    } else if (prim.k === "poly") {
      const q = prim.p.map(pr);
      props.push({ t: "poly", pts: q, w: prim.w, role: "propFill", stroke: "prop", d: q.reduce((a, b) => a + b[2], 0) / q.length });
    } else {
      const [lo, hi] = prim.p, corners = [];
      for (const x of [lo[0], hi[0]]) for (const y of [lo[1], hi[1]]) for (const z of [lo[2], hi[2]]) corners.push([x, y, z]);
      const q = corners.map(pr);
      props.push({ t: "poly", pts: hull(q), w: 0.8, role: "propFill", stroke: "prop", d: q.reduce((a, b) => a + b[2], 0) / 8 });
    }
  }
  const dT = (pr(pt(NECK))[2] + pr(pt(PELVIS))[2]) / 2;
  const alpha = d => 1 - 0.55 * Math.max(0, Math.min(1, (-2 - (d - dT)) / 10));
  const seg = (i, j, w) => { const a = pr(pt(i)), b = pr(pt(j)), d = (a[2] + b[2]) / 2; items.push({ t: "line", pts: [a, b], w, role: "ink", a: alpha(d), d }); };
  seg(NECK, PELVIS, 4.4); seg(ARM[0][0], ARM[1][0], 3.4); seg(LEG[0][0], LEG[1][0], 3.4);
  for (const [S, E, W] of ARM) { seg(S, E, 3.0); seg(E, W, 2.8); }
  for (const [H, K, A, T] of LEG) { seg(H, K, 3.4); seg(K, A, 3.0); seg(A, T, 2.4); }
  const hp = pr(pt(HEAD));
  items.push({ t: "circle", c: hp, rx: HEAD_R, ry: HEAD_R, role: "ink", a: 1, d: hp[2] });
  const np = pr(pt(NOSE));
  if (np[2] > hp[2] - 0.5) items.push({ t: "circle", c: np, rx: 1.1, ry: 1.1, role: "face", a: 1, d: hp[2] + 0.01 });

  const W = [pt(ARM[0][2]), pt(ARM[1][2])], S = [pt(ARM[0][0]), pt(ARM[1][0])];
  for (const im of ex.i || []) {
    const h = im.hands;
    const hands = h === "both" ? [[W[0], 0], [W[1], 1]] : h === "near" ? [[W[0], 0]] : [[mid3(W[0], W[1]), 0]];
    const t = im.t;
    if (t === "barbell") {
      const C = h !== "near" ? mid3(W[0], W[1]) : W[0];
      const a = pr(add3(C, [0, 0, -22])), b = pr(add3(C, [0, 0, 22]));
      items.push({ t: "line", pts: [a, b], w: 1.4, role: "steel", a: 1, d: (a[2] + b[2]) / 2 });
      for (const z of [-18, 18]) { const p = pr(add3(C, [0, 0, z])); items.push({ t: "circle", c: p, rx: Math.max(1.1, 7 * Math.abs(s)), ry: 7, role: "plate", a: 1, d: p[2] }); }
    } else if (t === "dumbbell") {
      for (const [H] of hands) {
        const a = pr(add3(H, [0, 0, -3.5])), b = pr(add3(H, [0, 0, 3.5]));
        items.push({ t: "line", pts: [a, b], w: 1.3, role: "steel", a: 1, d: (a[2] + b[2]) / 2 });
        for (const p of [a, b]) items.push({ t: "circle", c: p, rx: Math.max(1.0, 3 * Math.abs(s)), ry: 3, role: "plate", a: 1, d: p[2] });
      }
    } else if (t === "kettlebell") {
      for (const [H] of hands) {
        const a = pr(H), b = pr(add3(H, [0, -4.6, 0]));
        items.push({ t: "line", pts: [a, b], w: 1.2, role: "steel", a: 1, d: b[2] });
        items.push({ t: "circle", c: b, rx: 3.6, ry: 3.6, role: "plate", a: 1, d: b[2] + 0.01 });
      }
    } else if (t === "cable" || t === "band") {
      const anc = im.anchor;
      if (anc === "hands") { const a = pr(W[0]), b = pr(W[1]); items.push({ t: "line", pts: [a, b], w: 1.1, role: "band", a: 1, d: (a[2] + b[2]) / 2, dash: true }); continue; }
      for (const [H, i] of hands) {
        let A3;
        if (anc === "foot") A3 = pt(LEG[i][3]);
        else { const sgn = S[i][2] >= 0 ? 1 : -1; A3 = [anc[0], anc[1], anc[2] == null ? H[2] : sgn * anc[2]]; }
        const a = pr(H), b = pr(A3), d = (a[2] + b[2]) / 2;
        if (t === "cable") {
          items.push({ t: "line", pts: [a, b], w: 0.7, role: "cable", a: 1, d: d - 0.5 });
          items.push({ t: "circle", c: b, rx: 1.4, ry: 1.4, role: "steel", a: 1, d: b[2] });
          items.push({ t: "circle", c: a, rx: 1.5, ry: 1.5, role: "accent", a: 1, d: a[2] + 0.02 });
        } else items.push({ t: "line", pts: [a, b], w: 1.1, role: "band", a: 1, d, dash: true });
      }
    } else if (t === "handle") {
      for (const [H] of hands) { const a = pr(H); items.push({ t: "circle", c: a, rx: 1.7, ry: 1.7, role: "accent", a: 1, d: a[2] + 0.02 }); }
    } else if (t === "pad") {
      const idx = im.at === "ankle" ? [LEG[0][2], LEG[1][2]] : [ARM[0][0], ARM[1][0]];
      const P0 = pt(idx[0]), P1 = pt(idx[1]), u = norm3([P0[0] - P1[0], P0[1] - P1[1], P0[2] - P1[2]]);
      const a = pr(add3(P0, u, 3)), b = pr(add3(P1, u, -3));
      items.push({ t: "line", pts: [a, b], w: 4.4, role: "pad", a: 1, d: (a[2] + b[2]) / 2 + 0.5 });
    } else if (t === "sled") {
      const A0 = pt(LEG[0][2]), T0 = pt(LEG[0][3]), A1 = pt(LEG[1][2]), T1 = pt(LEG[1][3]);
      const m = mid3(A0, T0, A1, T1), u = norm3([T0[0] - A0[0], T0[1] - A0[1], T0[2] - A0[2]]);
      const q = [[-8, -9], [8, -9], [8, 9], [-8, 9]].map(([k1, k2]) => pr(add3(add3(m, u, k1), [0, 0, k2])));
      items.push({ t: "poly", pts: q, w: 1, role: "propFill", stroke: "steel", a: 1, d: q.reduce((a, b) => a + b[2], 0) / 4 - 3 });
    }
  }
  props.sort((a, b) => a.d - b.d);
  items.sort((a, b) => a.d - b.d);
  return [{ t: "line", pts: [[2, GROUND], [98, GROUND]], w: 1, role: "ground" }].concat(props, items);
}

function phase(time, T) {
  const u = (time % T) / T, tri = u < 0.5 ? u * 2 : 2 - u * 2;
  const x = Math.max(0, Math.min(1, (tri - 0.08) / 0.84));
  return 0.5 - 0.5 * Math.cos(Math.PI * x);
}
function frameAt(pat, t) {
  const fi = t * (NF - 1), i0 = Math.floor(fi), i1 = Math.min(i0 + 1, NF - 1), f = fi - i0;
  const A = pat.f[i0], B = pat.f[i1];
  return A.map((v, i) => v + (B[i] - v) * f);
}

let COLORS = {};
function readColors() {
  const cs = getComputedStyle(document.documentElement), g = n => cs.getPropertyValue(n).trim();
  COLORS = { ink: g("--ink"), accent: g("--accent"), plate: g("--accent"), steel: g("--steel"), prop: g("--prop"),
    propFill: g("--prop-fill"), cable: g("--cable"), band: g("--accent"), pad: g("--pad"), ground: g("--ground"), face: g("--face") };
}
readColors();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", readColors);
new MutationObserver(readColors).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

function draw(canvas, exId, time, yaw) {
  const ex = DATA.exercises[exId], pat = DATA.patterns[ex.p];
  const dpr = window.devicePixelRatio || 1, size = canvas.clientWidth;
  if (!size) return;
  if (canvas.width !== Math.round(size * dpr)) { canvas.width = Math.round(size * dpr); canvas.height = Math.round(size * dpr); }
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, size, size);
  const pad = size * 0.04, k = (size - pad * 2) / 100;
  const X = p => [pad + p[0] * k, pad + (100 - p[1]) * k];
  const F = frameAt(pat, phase(time, pat.T));
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  for (const op of scene(pat, ex, F, yaw)) {
    ctx.globalAlpha = op.a ?? 1;
    if (op.t === "line") {
      ctx.strokeStyle = COLORS[op.role]; ctx.lineWidth = Math.max(1, op.w * k);
      ctx.setLineDash(op.dash ? [2.4 * k, 1.8 * k] : []);
      ctx.beginPath(); op.pts.forEach((p, i) => { const [x, y] = X(p); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.stroke();
    } else if (op.t === "circle") {
      const [x, y] = X(op.c);
      ctx.fillStyle = COLORS[op.role];
      ctx.beginPath(); ctx.ellipse(x, y, op.rx * k, op.ry * k, 0, 0, Math.PI * 2); ctx.fill();
    } else if (op.pts.length >= 3) {
      ctx.setLineDash([]);
      ctx.fillStyle = COLORS[op.role]; ctx.strokeStyle = COLORS[op.stroke]; ctx.lineWidth = Math.max(1, op.w * k);
      ctx.beginPath(); op.pts.forEach((p, i) => { const [x, y] = X(p); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.closePath();
      ctx.fill(); ctx.stroke();
    } else {
      ctx.strokeStyle = COLORS[op.stroke]; ctx.lineWidth = Math.max(1, op.w * k);
      ctx.beginPath(); op.pts.forEach((p, i) => { const [x, y] = X(p); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.stroke();
    }
  }
  ctx.globalAlpha = 1; ctx.setLineDash([]);
}

// ---------- page ----------
const GROUPS = ["All", "Chest", "Back", "Shoulders", "Arms", "Legs", "Core"];
let view = "90", group = "All", query = "";
const list = document.getElementById("list");
const cards = [];
const visible = new Set();
const io = new IntersectionObserver(es => es.forEach(e => e.isIntersecting ? visible.add(e.target) : visible.delete(e.target)), { rootMargin: "200px" });

function render() {
  list.innerHTML = ""; cards.length = 0; visible.clear();
  const q = query.toLowerCase();
  const items = META.filter(m => (group === "All" || m.group === group) &&
    (!q || m.name.toLowerCase().includes(q) || m.equip.join(" ").toLowerCase().includes(q) || m.muscles.join(" ").toLowerCase().includes(q)));
  document.getElementById("count").textContent = `${items.length} of ${META.length} exercises`;
  if (!items.length) { list.innerHTML = '<p class="empty">No exercises match that search.</p>'; return; }
  for (const g of GROUPS.slice(1)) {
    const gi = items.filter(m => m.group === g);
    if (!gi.length) continue;
    const h = document.createElement("h2"); h.className = "group-title"; h.innerHTML = `${g} <small>${gi.length}</small>`;
    const grid = document.createElement("div"); grid.className = "grid";
    for (const m of gi) {
      const b = document.createElement("button"); b.className = "card"; b.type = "button";
      b.innerHTML = `<canvas aria-hidden="true"></canvas><span class="name"></span><span class="eq"></span>`;
      b.querySelector(".name").textContent = m.name;
      b.querySelector(".eq").textContent = m.equip.join(" \u00B7 ");
      b.addEventListener("click", () => openDetail(m));
      const c = b.querySelector("canvas"); c.dataset.ex = m.id; cards.push(c); io.observe(c);
      grid.appendChild(b);
    }
    list.append(h, grid);
  }
}

function setPressed(container, attr, value) {
  container.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset[attr] === value)));
}
const viewsEl = document.getElementById("views");
viewsEl.addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; view = b.dataset.yaw; setPressed(viewsEl, "yaw", view); });
const groupsEl = document.getElementById("groups");
groupsEl.innerHTML = GROUPS.map(g => `<button data-g="${g}" aria-pressed="${g === "All"}">${g}</button>`).join("");
groupsEl.addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; group = b.dataset.g; setPressed(groupsEl, "g", group); render(); });
document.getElementById("q").addEventListener("input", e => { query = e.target.value.trim(); render(); });

// detail
const dlg = document.getElementById("dlg"), big = document.getElementById("big"), dviews = document.getElementById("dviews");
let current = null, dYaw = 90, dSpin = false, dragging = null;
function openDetail(m) {
  current = m; dYaw = view === "spin" ? 90 : Number(view); dSpin = view === "spin";
  setPressed(dviews, "yaw", dSpin ? "spin" : String(dYaw));
  const pat = DATA.exercises[m.id].p;
  document.getElementById("dgroup").textContent = m.group;
  document.getElementById("dname").textContent = m.name;
  document.getElementById("dtags").innerHTML = m.muscles.map(x => `<span class="tag m"></span>`).join("") + m.equip.map(() => `<span class="tag"></span>`).join("");
  const tags = document.querySelectorAll("#dtags .tag");
  [...m.muscles, ...m.equip].forEach((t, i) => tags[i].textContent = t);
  const ol = document.getElementById("dcues"); ol.innerHTML = "";
  for (const c of DATA.cues[pat] || []) { const li = document.createElement("li"); li.textContent = c; ol.appendChild(li); }
  const tip = DATA.tips[m.id], tipEl = document.getElementById("dtip");
  tipEl.hidden = !tip; tipEl.textContent = tip || "";
  dlg.showModal();
}
document.getElementById("dclose").addEventListener("click", () => dlg.close());
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });
dlg.addEventListener("close", () => { current = null; });
dviews.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  dSpin = b.dataset.yaw === "spin"; if (!dSpin) dYaw = Number(b.dataset.yaw);
  setPressed(dviews, "yaw", b.dataset.yaw);
});
const stage = document.getElementById("stage");
stage.addEventListener("pointerdown", e => { dragging = { x: e.clientX, yaw: dYaw }; dSpin = false; setPressed(dviews, "yaw", ""); stage.setPointerCapture(e.pointerId); });
stage.addEventListener("pointermove", e => { if (dragging) dYaw = dragging.yaw - (e.clientX - dragging.x) * 0.6; });
stage.addEventListener("pointerup", () => { dragging = null; });

const t0 = performance.now();
let last = t0;
function loop(now) {
  const time = (now - t0) / 1000, dt = (now - last) / 1000; last = now;
  const play = reduced ? 1.3 : time;
  const yaw = view === "spin" ? 90 + time * 40 : Number(view);
  for (const c of visible) draw(c, c.dataset.ex, play, yaw * Math.PI / 180);
  if (current) {
    if (dSpin) dYaw += dt * 40;
    draw(big, current.id, time, dYaw * Math.PI / 180);
    const deg = ((Math.round(dYaw) % 360) + 360) % 360;
    document.getElementById("angle").textContent = `${deg}\u00B0`;
  }
  requestAnimationFrame(loop);
}
render();
requestAnimationFrame(loop);
</script>
